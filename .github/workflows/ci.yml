name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        component: [backend, frontend]
    defaults:
      run:
        working-directory: ${{ matrix.component }}
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/codereviewer_test
      JWT_SECRET: ci-only-synthetic-signing-value-not-for-deployment
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: ${{ matrix.component }}/package-lock.json
      - run: npm ci
      - if: matrix.component == 'backend'
        run: npm run db:generate
      - run: npm run lint
      - if: matrix.component == 'backend'
        run: npm test
      - if: matrix.component == 'frontend'
        run: npm run typecheck
      - run: npm run build
      - run: npm audit --audit-level=high
  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16.13-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: codereviewer_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d codereviewer_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/codereviewer_test
      JWT_SECRET: ci-only-synthetic-signing-value-not-for-deployment
      RUN_DATABASE_TESTS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.0
      - run: npm ci
      - run: npm run db:generate
      - run: npm run prisma:validate
      - run: npm run db:deploy
      - run: npm run test:integration
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check src tests scripts
      - run: ruff format --check src tests scripts
      - run: python -m compileall -q src tests scripts
      - run: python -m unittest discover -s tests -v
      - run: python -m src.training.train --config configs/train.json --validate-only
      - run: pip-audit -r requirements-training.txt --require-hashes --disable-pip
      - run: pip-audit -r requirements-cpu.txt --require-hashes --disable-pip --vulnerability-service osv --strict
  ml-interfaces:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CUDA_VISIBLE_DEVICES: ''
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r requirements-cpu.txt --extra-index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v
      - run: python -m scripts.check_training_cpu
  hygiene:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: python scripts/check_public.py --strict
      - name: Validate workflow syntax
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "$(go env GOPATH)/bin/actionlint"
      - name: Scan complete Git history for secrets
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.24.3
          "$(go env GOPATH)/bin/gitleaks" git --redact --no-banner .
      - name: Validate Compose and build backend container
        env:
          POSTGRES_PASSWORD: ci-synthetic-disposable
        run: |
          cp backend/.env.example backend/.env
          docker compose config --quiet
          docker build --tag codereviewer-ci backend
