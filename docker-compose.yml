# Local development database; never expose this configuration publicly.
services:
  postgres:
    image: postgres:16.13-alpine
    environment:
      POSTGRES_USER: codereviewer
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: codereviewer
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codereviewer -d codereviewer"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    profiles: [app]
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://codereviewer:${POSTGRES_PASSWORD}@postgres:5432/codereviewer?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    extra_hosts:
      - host.docker.internal:host-gateway
volumes:
  postgres-data:
